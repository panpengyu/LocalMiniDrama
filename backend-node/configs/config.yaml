app:
  name: LocalMiniDrama API
  version: 1.6.0
  debug: true
  language: zh
  # S17-T03 支付配置加密存储密钥（AES-256-GCM；生产环境请改为强随机串并妥善保管）
  secret: LocalMiniDrama#S17#PaySecret#2026
server:
  port: 5679
  host: 0.0.0.0
  cors_origins:
    - http://localhost:3012
    - http://localhost:3013
    - http://localhost:3014
  read_timeout: 600
  write_timeout: 600
  insecure_tls: true
database:
  type: mysql
  host: localhost
  port: 3306
  user: root
  password: root
  database: localminidrama
  max_idle: 10
  max_open: 100
storage:
  type: local
  local_path: ./data/storage
  base_url: http://localhost:5679/static
video:
  generation_timeout_minutes: 30
ai:
  default_text_provider: openai
  default_image_provider: openai
  default_video_provider: doubao
style:
  default_style: ''
  default_role_style: full body and face clearly visible, character centered, consistent facial features, high detail, masterpiece, best quality
  default_scene_style: wide establishing shot, highly detailed environment, sharp focus, rich atmosphere, masterpiece, best quality
  default_prop_style: object centered, clean simple background, studio lighting, sharp focus, high detail, masterpiece, best quality
  default_image_ratio: '16:9'
  default_video_ratio: '16:9'
  default_prop_ratio: '1:1'
  default_image_size: 1024x1024
vendor_lock:
  enabled: false
  config_file: ai-configs-qudao.json
image_proxy:
  expire_hours: 2
  use_for_video: true
  upload_timeout_seconds: 180
  upload_max_attempts: 2
redis:
  host: 127.0.0.1
  port: 6379
  password: ''
  db: 0
queue:
  default_attempts: 3
  backoff_type: exponential
  backoff_delay: 5000
  concurrency: 2
  bgm_concurrency: 4
  merge_concurrency: 2
  enabled: true
# S18-T02 报表推送（SMTP 邮件 / 钉钉 webhook；未配置时自动降级为记录失败日志，不影响业务）
notify:
  smtp:
    enabled: false
    host: smtp.example.com
    port: 465
    secure: true
    user: ''
    pass: ''
    from: 'LocalMiniDrama 报表 <noreply@example.com>'
    transport: ''            # 可选：json（测试用，不真正联网；空则走真实 SMTP）
  dingtalk:
    webhook: ''
    secret: ''               # 加签密钥（机器人安全设置里生成），留空表示不签名
  retry:
    max_attempts: 3          # 发送失败最大重试次数
    interval_ms: 300000      # 重试间隔 5 分钟
  cron:
    enabled: true            # 是否启用 node-cron 调度器
    timezone: Asia/Shanghai