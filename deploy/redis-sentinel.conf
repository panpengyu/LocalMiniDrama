# ============================================================
# Sprint 16 - S16-T04 Redis 哨兵（Redis Sentinel）配置示例
# 三节点哨兵 + 一主一从，主库故障自动切换（本项目 Redis 用于
# Bull 任务队列 / 缓存 / 限流计数，队列与缓存均容忍短时降级）
#
# 节点拓扑（示例）：
#   node1: 10.0.0.31  redis(6379 主) + sentinel(26379)
#   node2: 10.0.0.32  redis(6379 从) + sentinel(26379)
#   node3: 10.0.0.33  redis(6379 从) + sentinel(26379)
# ============================================================

# ---------- 主从 Redis（每个节点 redis.conf 共同部分） ----------
# 主节点（node1）：
#   port 6379
#   requirepass CHANGE_ME_REDIS_PASSWORD
#   masterauth  CHANGE_ME_REDIS_PASSWORD
# 从节点（node2/3 追加）：
#   replicaof 10.0.0.31 6379
#   replica-read-only yes

# ---------- 哨兵配置（每个节点 sentinel.conf，这里以 node1 为模板） ----------
port 26379
daemonize yes
pidfile /var/run/redis-sentinel.pid
logfile "/var/log/redis/sentinel.log"
dir /var/lib/redis

# 监控主库：sentinel monitor <name> <host> <port> <quorum>
# quorum=2 表示至少 2 个哨兵同意才判定主库下线
sentinel monitor mymaster 10.0.0.31 6379 2
sentinel auth-pass mymaster CHANGE_ME_REDIS_PASSWORD
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 15000
sentinel parallel-syncs mymaster 1

# 应用侧（backend-node config.production.yaml redis 段）接入示例：
#   redis:
#     sentinels:
#       - host: 10.0.0.31; port: 26379
#       - host: 10.0.0.32; port: 26379
#       - host: 10.0.0.33; port: 26379
#     name: mymaster
#     password: CHANGE_ME_REDIS_PASSWORD

# 验证命令：
#   redis-cli -p 26379 sentinel get-master-addr-by-name mymaster
#   redis-cli -p 26379 sentinel master mymaster
