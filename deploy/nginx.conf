# ============================================================
# Sprint 16 - S16-T04 生产环境 Nginx 配置（负载均衡 + 静态资源 + gzip）
# 放置于 /etc/nginx/conf.d/localminidrama.conf
# ============================================================

# 后端 PM2 集群 upstream（多个实例轮询）
upstream localminidrama_api {
    least_conn;                 # 最少连接算法，降低 P99
    server 127.0.0.1:5679 max_fails=3 fail_timeout=10s;
    # 多机部署时追加：
    # server 10.0.0.21:5679 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name user.example.com admin.example.com;

    # ---------- 安全响应头（与后端 helmet 双层防护） ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- gzip 压缩（S16-T02 性能优化） ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_vary on;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://localminidrama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;      # 视频生成等长任务
        proxy_send_timeout 600s;
        # 后端限流后配合：限流时客户端看到 429 重试提示
    }

    # ---------- 静态资源（本地存储） ----------
    location /static/ {
        alias /data/localminidrama/storage/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 防路径穿越（Nginx 层二次防护）
        location ~ /static/.*\.\./ { deny all; }
    }

    # ---------- 前端（可选：由本 Nginx 直接托管构建产物） ----------
    location / {
        root /data/localminidrama/front-user/dist;
        try_files $uri $uri/ /index.html;
    }
    location /admin/ {
        alias /data/localminidrama/front-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }
}
